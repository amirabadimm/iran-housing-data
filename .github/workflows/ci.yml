name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "ruff>=0.8,<1"
      - name: Ruff
        run: python -m ruff check --select E9,F63,F7,F82 pipelines
      - name: Compile pipelines
        run: python -m compileall -q pipelines
